<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Nitish Kumar — Senior Python Developer | AI Agents &amp; Backend Architecture</title>
    <meta
      name="description"
      content="Nitish Kumar builds production-grade backend systems and intelligent AI applications — scalable APIs, microservices, autonomous AI agents, voice systems and LLM-powered workflows."
    />
    <meta name="author" content="Nitish Kumar" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nitish Kumar — Senior Python Developer" />
    <meta
      property="og:description"
      content="AI Agents · Agentic AI · LLM Applications · FastAPI Systems · Backend Architecture"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint: no flash of the wrong theme on load.
      // Light is the default; dark applies only if the visitor chose it.
      (function () {
        try {
          if (localStorage.getItem('nk-theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* Storage blocked — the light default already applies. */
        }
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
