      rel="stylesheet"
    />
    <script>
      // Runs before first paint: no flash of the wrong world on load.
      // The Notebook is the default; the GPU Room applies only if the visitor chose it.
      (function () {
        try {
          if (localStorage.getItem('nk-theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* Storage blocked — the light default already applies. */
        }
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
